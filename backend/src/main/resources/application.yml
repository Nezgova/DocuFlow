spring:
  application:
    name: docuflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/docuflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
server:
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET:development-secret-development-secret-32}
    expiration-ms: 86400000
  storage-dir: ${DOCUMENT_STORAGE_DIR:uploads}
